name: Web Production Browser QA

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/web-preview-browser-qa.yml"
      - "apps/web/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    name: Local production browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEPTLIUM_WEB_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Web production application
        run: pnpm --filter @neptlium/web build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Web production application
        shell: bash
        run: |
          pnpm --filter @neptlium/web exec next start -H 127.0.0.1 -p 3000 > /tmp/neptlium-web.log 2>&1 &
          echo $! > /tmp/neptlium-web.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/neptlium-web.log
          exit 1
      - name: Run Playwright release QA
        working-directory: apps/web
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptlium-web-playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neptlium-web-browser-failures
          path: apps/web/test-results/
          retention-days: 14
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neptlium-web-server-log
          path: /tmp/neptlium-web.log
          retention-days: 14
