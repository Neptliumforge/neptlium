name: Temporary Treasury migration test path reconciliation

on:
  push:
    branches:
      - feat/treasury-provider-orchestration-foundation
    paths:
      - '.github/workflows/tmp-treasury-migration-test-paths.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/treasury-provider-orchestration-foundation
          fetch-depth: 0
      - name: Reconcile migration test paths
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#supabase/migrations/20260811073000_allocation_engine_foundation.sql#supabase/migrations/20260811161533_allocation_engine_foundation.sql#g' apps/api/test/allocation-migration-authority.test.mjs
          sed -i 's#supabase/migrations/20260811073500_allocation_api_authority_grants.sql#supabase/migrations/20260811161550_allocation_api_authority_grants.sql#g' apps/api/test/allocation-migration-authority.test.mjs
          sed -i 's#supabase/migrations/20260813090000_distributed_api_rate_limiting.sql#supabase/migrations/20260815115118_distributed_api_rate_limiting.sql#g' apps/api/test/distributed-rate-limit.test.mjs
          sed -i 's#supabase/migrations/20260820190000_identity_principal_provider_subject_foundation.sql#supabase/migrations/20260825051902_identity_principal_provider_subject_foundation.sql#g' apps/api/test/identity-principal-migration.test.mjs
          sed -i 's#supabase/migrations/20260908053000_provider_webhook_control_plane.sql#supabase/migrations/20260908091732_provider_webhook_control_plane.sql#g' apps/api/test/provider-webhook-control-plane.test.mjs
          sed -i 's#supabase/migrations/20260818120000_self_custody_treasury_destination_foundation.sql#supabase/archive/superseded/20260818120000_self_custody_treasury_destination_foundation.sql#g' apps/api/test/treasury-database-concurrency.test.mjs apps/api/test/treasury-destination-domain.test.mjs
          git diff --check
          git diff --exit-code --quiet && exit 0
          git config user.name 'neptlium-release-bot'
          git config user.email 'neptlium-release-bot@users.noreply.github.com'
          git add apps/api/test
          git commit -m 'test(api): reconcile migration history paths'
          git push origin HEAD:feat/treasury-provider-orchestration-foundation
