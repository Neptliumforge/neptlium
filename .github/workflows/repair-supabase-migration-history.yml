name: Repair Supabase Migration History

on:
  push:
    branches:
      - fix/supabase-migration-history

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align repository migration versions with production ledger
        shell: bash
        run: |
          set -euo pipefail
          move_if_present() {
            src="$1"
            dst="$2"
            if [ -f "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              git mv "$src" "$dst"
            fi
          }

          # Superseded prototypes that were never recorded in production migration history.
          move_if_present supabase/migrations/20260728120000_api_foundation_ledger.sql supabase/archive/superseded/20260728120000_api_foundation_ledger.sql
          move_if_present supabase/migrations/20260731120000_api_operations.sql supabase/archive/superseded/20260731120000_api_operations.sql
          move_if_present supabase/migrations/20260810120000_circle_provider_foundation.sql supabase/archive/superseded/20260810120000_circle_provider_foundation.sql
          move_if_present supabase/migrations/20260818120000_self_custody_treasury_destination_foundation.sql supabase/archive/superseded/20260818120000_self_custody_treasury_destination_foundation.sql

          # Same logical migrations, renamed to the versions actually recorded by production.
          move_if_present supabase/migrations/20260731130000_atomic_account_provisioning.sql supabase/migrations/20260809040703_atomic_account_provisioning.sql
          move_if_present supabase/migrations/20260809000000_api_account_onboarding.sql supabase/migrations/20260809141841_api_account_onboarding.sql
          move_if_present supabase/migrations/20260809170000_fix_account_onboarding_rpc.sql supabase/migrations/20260809163305_fix_account_onboarding_rpc.sql
          move_if_present supabase/migrations/20260809173000_fix_account_onboarding_profile_id.sql supabase/migrations/20260809163555_fix_account_onboarding_profile_id.sql
          move_if_present supabase/migrations/20260810220000_production_funding_treasury_transfer_foundation.sql supabase/migrations/20260811161123_production_funding_treasury_transfer_foundation.sql
          move_if_present supabase/migrations/20260810223000_governed_financial_operations.sql supabase/migrations/20260811161216_governed_financial_operations.sql
          move_if_present supabase/migrations/20260810224500_transfer_reconciliation_hardening.sql supabase/migrations/20260811161300_transfer_reconciliation_hardening.sql
          move_if_present supabase/migrations/20260811041500_omnibus_treasury_funding_model.sql supabase/migrations/20260811161413_omnibus_treasury_funding_model.sql
          move_if_present supabase/migrations/20260811073000_allocation_engine_foundation.sql supabase/migrations/20260811161533_allocation_engine_foundation.sql
          move_if_present supabase/migrations/20260811073500_allocation_api_authority_grants.sql supabase/migrations/20260811161550_allocation_api_authority_grants.sql
          move_if_present supabase/migrations/20260812080000_single_general_platform_admin.sql supabase/migrations/20260812115731_single_general_platform_admin.sql
          move_if_present supabase/migrations/20260813090000_distributed_api_rate_limiting.sql supabase/migrations/20260815115118_distributed_api_rate_limiting.sql
          move_if_present supabase/migrations/20260820190000_identity_principal_provider_subject_foundation.sql supabase/migrations/20260825051902_identity_principal_provider_subject_foundation.sql
          move_if_present supabase/migrations/20260820203000_clerk_identity_linking_commands.sql supabase/migrations/20260825051927_clerk_identity_linking_commands.sql
          move_if_present supabase/migrations/20260820210000_clerk_dual_session_link_service.sql supabase/migrations/20260825053722_clerk_dual_session_link_service.sql
          move_if_present supabase/migrations/20260820220000_clerk_application_identity_cutover.sql supabase/migrations/20260825053749_clerk_application_identity_cutover.sql
          move_if_present supabase/migrations/20260820221000_clerk_bootstrap_existing_account_guard.sql supabase/migrations/20260825053809_clerk_bootstrap_existing_account_guard.sql
          move_if_present supabase/migrations/20260825080000_self_custody_treasury_principal_cutover.sql supabase/migrations/20260825082059_self_custody_treasury_principal_cutover.sql
          move_if_present supabase/migrations/20260908043000_thesis_mode_foundation.sql supabase/migrations/20260908051241_thesis_mode_foundation.sql
          move_if_present supabase/migrations/20260908050500_thesis_evaluation_snapshots.sql supabase/migrations/20260908051251_thesis_evaluation_snapshots.sql
          move_if_present supabase/migrations/20260908052600_thesis_decision_history.sql supabase/migrations/20260908053417_thesis_decision_history.sql
          move_if_present supabase/migrations/20260908053000_provider_webhook_control_plane.sql supabase/migrations/20260908091732_provider_webhook_control_plane.sql
          move_if_present supabase/migrations/20260913023000_webhook_disposition_evidence.sql supabase/migrations/20260913024025_webhook_disposition_evidence.sql
          move_if_present supabase/migrations/20260913061000_gate05_retire_legacy_financial_authority.sql supabase/migrations/20260913052329_gate05_retire_legacy_financial_authority.sql
          move_if_present supabase/migrations/20260913062500_gate05_legacy_table_readonly_grants.sql supabase/migrations/20260913052717_gate05_legacy_table_readonly_grants.sql

          if git diff --cached --quiet; then
            echo 'No migration-history changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(db): reconcile migration versions with production history'
          git push origin HEAD:fix/supabase-migration-history
