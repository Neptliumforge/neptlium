name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check
      - run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neptlium/ui typecheck
      - run: pnpm --filter @neptlium/ui lint
      - run: pnpm --filter @neptlium/web typecheck
      - run: pnpm --filter @neptlium/web lint
      - run: pnpm --filter @neptlium/web test
      - run: pnpm --filter @neptlium/web build
