name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-stripe-ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neptlium/api typecheck
      - run: pnpm --filter @neptlium/api lint
      - run: pnpm --filter @neptlium/api test
      - run: pnpm --filter @neptlium/api vercel-build
      - run: node --test supabase/test/stripe-webhook-retirement.test.mjs
      - run: node --test supabase/test/gate05-legacy-authority-retirement.test.mjs

  validate-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neptlium/app typecheck
      - run: pnpm --filter @neptlium/app lint
      - run: pnpm --filter @neptlium/app test
      - run: pnpm --filter @neptlium/app build

  validate-product-family:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neptlium/types typecheck
      - run: pnpm --filter @neptlium/types lint
      - run: pnpm --filter @neptlium/vault typecheck
      - run: pnpm --filter @neptlium/vault lint
      - run: pnpm --filter @neptlium/vault test
      - run: pnpm --filter @neptlium/vault build
      - run: pnpm --filter @neptlium/pay typecheck
      - run: pnpm --filter @neptlium/pay lint
      - run: pnpm --filter @neptlium/pay test
      - run: pnpm --filter @neptlium/pay build
      - run: pnpm --filter @neptlium/docs typecheck
      - run: pnpm --filter @neptlium/docs lint
      - run: pnpm --filter @neptlium/docs test
      - run: pnpm --filter @neptlium/docs build
      - run: pnpm --filter @neptlium/status typecheck
      - run: pnpm --filter @neptlium/status lint
      - run: pnpm --filter @neptlium/status test
      - run: pnpm --filter @neptlium/status build

  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check
      - run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neptlium/ui typecheck
      - run: pnpm --filter @neptlium/ui lint
      - run: pnpm --filter @neptlium/web typecheck
      - run: pnpm --filter @neptlium/web lint
      - run: pnpm --filter @neptlium/web test
      - run: pnpm --filter @neptlium/web build
