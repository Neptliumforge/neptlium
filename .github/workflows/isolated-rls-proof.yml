# REVIEW ONLY: disabled until immutable PostgreSQL image digest is independently verified.
# No Supabase connections, credentials, or deployments.
name: Isolated PostgreSQL RLS security proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-rls:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        # BLOCKER: replace tag with independently verified immutable SHA256 digest.
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U postgres' --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create disposable database
        env:
          PGPASSWORD: disposable-test-only
        run: psql -h localhost -U postgres -d postgres -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE neptlium_disposable_rls'
      - name: Test event-trigger function
        env:
          PGPASSWORD: disposable-test-only
        run: psql -h localhost -U postgres -d neptlium_disposable_rls -X -v ON_ERROR_STOP=1 -f tests/rls-exact-production.sql
