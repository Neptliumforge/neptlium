name: One-shot Treasury Route Repair

on:
  push:
    branches:
      - product/neptlium-treasury-hierarchy

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/neptlium-treasury-hierarchy
      - name: Repair identifiers and retired public route artifacts
        run: |
          python - <<'PY'
          import pathlib, subprocess
          replacements = [
              ('Neptlium TreasuryPage', 'BusinessTreasuryPage'),
              ('treasuryRail', 'treasuryProduct'),
              ('/treasuryrail', '/business'),
          ]
          skip = {'.github/workflows/treasury-route-repair.yml'}
          for raw in filter(None, subprocess.check_output(['git','ls-files','-z']).decode().split('\0')):
              if raw in skip or raw.startswith(('supabase/migrations/', 'docs/archive/')):
                  continue
              path = pathlib.Path(raw)
              try:
                  text = path.read_text()
              except (OSError, UnicodeDecodeError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair Treasury route and component identifiers'
          git push origin HEAD:product/neptlium-treasury-hierarchy
