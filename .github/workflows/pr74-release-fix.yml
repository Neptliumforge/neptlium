name: PR74 Release State Fix

on:
  push:
    branches:
      - product/authenticated-operating-environment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve unavailable capability state
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/app/components/product/OperatingExperience.tsx')
          text = path.read_text()
          text = text.replace(
              "  const liveTransfers = snapshot.transferCapabilities.state === 'READY' ? enabled(snapshot.transferCapabilities.data) : [];",
              "  const transferCapabilitiesAvailable = snapshot.transferCapabilities.state === 'READY';\n  const liveTransfers = transferCapabilitiesAvailable ? enabled(snapshot.transferCapabilities.data) : [];",
              1,
          )
          text = text.replace(
              "<article className=\"op-panel\"><SectionHeading label=\"Funding\" title=\"Live routes\" action={liveFunding.length ? <Link href=\"/dashboard/deposit\">Deposit <ArrowRight size={14}/></Link> : null}/><div className=\"op-row-list\">{funding.length ? funding.map((item) => <div className=\"op-data-row\" key={item.code}><span><strong>{item.asset}</strong><small>{item.network}</small></span><ProductStateBadge state={item.state === 'ENABLED' ? 'READY' : item.state === 'NOT_CONFIGURED' ? 'NOT_CONFIGURED' : 'CAPABILITY_DISABLED'}>{item.state.replaceAll('_',' ')}</ProductStateBadge></div>) : <div className=\"op-empty-row\"><strong>No funding routes reported</strong><span>No rail is presented as live.</span></div>}</div></article>",
              "<article className=\"op-panel\"><SectionHeading label=\"Funding\" title=\"Live routes\" action={liveFunding.length ? <Link href=\"/dashboard/deposit\">Deposit <ArrowRight size={14}/></Link> : null}/><div className=\"op-row-list\">{snapshot.fundingCapabilities.state !== 'READY' ? <div className=\"op-empty-row\"><strong>Funding capability unavailable</strong><span>Funding routes could not be loaded. No rail is presented as disabled or available without authoritative capability state.</span></div> : funding.length ? funding.map((item) => <div className=\"op-data-row\" key={item.code}><span><strong>{item.asset}</strong><small>{item.network}</small></span><ProductStateBadge state={item.state === 'ENABLED' ? 'READY' : item.state === 'NOT_CONFIGURED' ? 'NOT_CONFIGURED' : 'CAPABILITY_DISABLED'}>{item.state.replaceAll('_',' ')}</ProductStateBadge></div>) : <div className=\"op-empty-row\"><strong>No funding routes reported</strong><span>The authoritative capability response contains no funding routes.</span></div>}</div></article>",
              1,
          )
          text = text.replace(
              "<p className=\"op-footnote\">Outbound actions remain hidden unless live capability exists. Enabled outbound routes: {liveTransfers.length}.</p>",
              "<p className=\"op-footnote\">{transferCapabilitiesAvailable ? <>Outbound actions remain hidden unless live capability exists. Enabled outbound routes: {liveTransfers.length}.</> : <>Outbound capability unavailable. Transfer actions remain hidden until authoritative capability state is available.</>}</p>",
              1,
          )
          text = text.replace(
              "<article className=\"op-panel\"><SectionHeading label=\"Deposit routes\" title=\"Funding readiness\"/><div className=\"op-row-list\">{funding.length ? funding.map((item) => <div className=\"op-data-row\" key={item.code}><span><strong>{item.asset} · {item.network}</strong><small>{item.code}</small></span><ProductStateBadge state={item.state === 'ENABLED' ? 'READY' : item.state === 'NOT_CONFIGURED' ? 'NOT_CONFIGURED' : 'CAPABILITY_DISABLED'}>{item.state.replaceAll('_',' ')}</ProductStateBadge></div>) : <div className=\"op-empty-row\"><strong>No verified funding routes</strong><span>Unsupported rails are not shown as available.</span></div>}</div></article>",
              "<article className=\"op-panel\"><SectionHeading label=\"Deposit routes\" title=\"Funding readiness\"/><div className=\"op-row-list\">{snapshot.fundingCapabilities.state !== 'READY' ? <div className=\"op-empty-row\"><strong>Funding capability unavailable</strong><span>Funding readiness could not be loaded. Unknown capability state is not rendered as an empty route set.</span></div> : funding.length ? funding.map((item) => <div className=\"op-data-row\" key={item.code}><span><strong>{item.asset} · {item.network}</strong><small>{item.code}</small></span><ProductStateBadge state={item.state === 'ENABLED' ? 'READY' : item.state === 'NOT_CONFIGURED' ? 'NOT_CONFIGURED' : 'CAPABILITY_DISABLED'}>{item.state.replaceAll('_',' ')}</ProductStateBadge></div>) : <div className=\"op-empty-row\"><strong>No verified funding routes</strong><span>The authoritative capability response contains no funding routes.</span></div>}</div></article>",
              1,
          )
          text = text.replace(
              "<article className=\"op-panel\"><SectionHeading label=\"Destinations\" title=\"Withdrawal destinations\" action={outbound.length ? <Link href=\"/dashboard/capital-account#destinations\">Add destination <ArrowRight size={14}/></Link> : null}/><div className=\"op-row-list\">{destinations.length ? destinations.map((item) => <div className=\"op-data-row\" key={item.id}><span><strong>{item.alias}</strong><small>{item.destination_type.replaceAll('_',' ')}</small></span><ProductStateBadge state={item.verification_state === 'verified' && item.activation_state === 'active' ? 'READY' : 'REQUIRES_APPROVAL'}>{item.verification_state.replaceAll('_',' ')}</ProductStateBadge></div>) : <div className=\"op-empty-row\"><strong>No destinations saved</strong><span>A destination is never inferred from provider state.</span></div>}</div></article>",
              "<article className=\"op-panel\"><SectionHeading label=\"Destinations\" title=\"Withdrawal destinations\" action={outbound.length ? <Link href=\"/dashboard/capital-account#destinations\">Add destination <ArrowRight size={14}/></Link> : null}/><div className=\"op-row-list\">{snapshot.transferCapabilities.state !== 'READY' ? <div className=\"op-empty-row\"><strong>Transfer capability unavailable</strong><span>Outbound authority could not be loaded. No transfer route is inferred from an unavailable capability projection.</span></div> : destinations.length ? destinations.map((item) => <div className=\"op-data-row\" key={item.id}><span><strong>{item.alias}</strong><small>{item.destination_type.replaceAll('_',' ')}</small></span><ProductStateBadge state={item.verification_state === 'verified' && item.activation_state === 'active' ? 'READY' : 'REQUIRES_APPROVAL'}>{item.verification_state.replaceAll('_',' ')}</ProductStateBadge></div>) : <div className=\"op-empty-row\"><strong>No destinations saved</strong><span>A destination is never inferred from provider state.</span></div>}</div></article>",
              1,
          )
          if text == path.read_text():
              raise SystemExit('expected replacements did not apply')
          path.write_text(text)
      - name: Commit product-state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/components/product/OperatingExperience.tsx
          git commit -m "fix(app): distinguish unavailable capability projections"
          git push origin HEAD:product/authenticated-operating-environment
