name: Reconcile workspace lockfile

on:
  push:
    branches:
      - release/final-platform-reconciliation
    paths:
      - .github/workflows/reconcile-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/final-platform-reconciliation
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: reconcile workspace lockfile"
          git push origin HEAD:release/final-platform-reconciliation
