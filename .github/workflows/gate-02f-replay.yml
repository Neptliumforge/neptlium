name: Gate 02F disposable Supabase replay

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gate-02f-replay.yml'
      - 'supabase/**'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize disposable Supabase and replay the canonical migrations
        run: |
          supabase --version
          supabase init
          if ! supabase start > "$RUNNER_TEMP/gate02f-start.log" 2>&1; then
            sed -nE '/Applying migration [0-9]{14}_[a-z0-9_]+\.sql/p; s/.*\(SQLSTATE ([A-Z0-9]{5})\).*/SQLSTATE \1/p' "$RUNNER_TEMP/gate02f-start.log"
            exit 1
          fi
      - name: Verify history and repeat the replay
        shell: bash
        run: |
          set -euo pipefail
          db="$(docker ps --filter 'name=^/supabase_db_' --format '{{.Names}}')"
          test -n "$db"
          history() {
            docker exec "$db" psql -U postgres -d postgres -XAt -v ON_ERROR_STOP=1 \
              -c "select coalesce(json_agg(version order by version), '[]'::json) from supabase_migrations.schema_migrations"
          }
          snapshot() {
            docker exec "$db" pg_dump -U postgres -d postgres --schema-only --schema=public \
              --schema=supabase_migrations | sed '/^\\restrict /d; /^\\unrestrict /d'
          }
          history > "$RUNNER_TEMP/gate02f-history.json"
          node supabase/scripts/schema-install-plan.mjs "$RUNNER_TEMP/gate02f-history.json" > "$RUNNER_TEMP/gate02f-plan.json"
          node -e 'const p = require(process.argv[1]); if (p.appliedCount !== 50 || p.pending.length) process.exit(1); console.log("Verified 50 versions and zero pending migrations");' \
            "$RUNNER_TEMP/gate02f-plan.json"
          docker exec -i "$db" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 < supabase/test/gate-02f-replayed-contract.sql
          snapshot > "$RUNNER_TEMP/gate02f-schema.sql"
          supabase db reset --local --no-seed
          history > "$RUNNER_TEMP/gate02f-repeat-history.json"
          snapshot > "$RUNNER_TEMP/gate02f-repeat-schema.sql"
          cmp "$RUNNER_TEMP/gate02f-history.json" "$RUNNER_TEMP/gate02f-repeat-history.json"
          cmp "$RUNNER_TEMP/gate02f-schema.sql" "$RUNNER_TEMP/gate02f-repeat-schema.sql"
          docker exec "$db" pg_dump -U postgres -d postgres --format=custom --schema=public \
            --schema=supabase_migrations > "$RUNNER_TEMP/gate02f.backup"
          docker exec -i "$db" pg_restore --list < "$RUNNER_TEMP/gate02f.backup" > /dev/null
          sha256sum "$RUNNER_TEMP/gate02f.backup" > "$RUNNER_TEMP/gate02f.backup.sha256"
      - name: Restore the verified backup onto a second disposable Supabase instance
        shell: bash
        run: |
          set -euo pipefail
          supabase stop --no-backup
          sha256sum --check "$RUNNER_TEMP/gate02f.backup.sha256"
          mkdir "$RUNNER_TEMP/gate02f-restore"
          cd "$RUNNER_TEMP/gate02f-restore"
          supabase init
          if ! supabase start > "$RUNNER_TEMP/gate02f-start.log" 2>&1; then
            sed -nE '/Applying migration [0-9]{14}_[a-z0-9_]+\.sql/p; s/.*\(SQLSTATE ([A-Z0-9]{5})\).*/SQLSTATE \1/p' "$RUNNER_TEMP/gate02f-start.log"
            exit 1
          fi
          db="$(docker ps --filter 'name=^/supabase_db_' --format '{{.Names}}')"
          test -n "$db"
          docker exec "$db" psql -U postgres -d postgres -X -v ON_ERROR_STOP=1 \
            -c 'create schema if not exists supabase_migrations authorization postgres'
          docker cp "$RUNNER_TEMP/gate02f.backup" "$db:/tmp/gate02f.backup"
          docker exec "$db" pg_restore --list /tmp/gate02f.backup \
            | sed -E '/^[0-9]+; [0-9]+ [0-9]+ SCHEMA - (public|supabase_migrations) /d' \
            > "$RUNNER_TEMP/gate02f-restore.list"
          docker exec -i "$db" pg_restore -U postgres -d postgres --exit-on-error \
            --use-list=/dev/stdin /tmp/gate02f.backup < "$RUNNER_TEMP/gate02f-restore.list"
          docker exec "$db" psql -U postgres -d postgres -XAt -v ON_ERROR_STOP=1 \
            -c "select coalesce(json_agg(version order by version), '[]'::json) from supabase_migrations.schema_migrations" \
            > "$RUNNER_TEMP/gate02f-restored-history.json"
          docker exec "$db" pg_dump -U postgres -d postgres --schema-only --schema=public \
            --schema=supabase_migrations | sed '/^\\restrict /d; /^\\unrestrict /d' \
            > "$RUNNER_TEMP/gate02f-restored-schema.sql"
          cmp "$RUNNER_TEMP/gate02f-history.json" "$RUNNER_TEMP/gate02f-restored-history.json"
          cmp "$RUNNER_TEMP/gate02f-schema.sql" "$RUNNER_TEMP/gate02f-restored-schema.sql"
