name: Neptlium Product Family Validation

on:
  pull_request:
  push:
    branches:
      - main
      - product/neptlium-treasury-hierarchy

permissions:
  contents: read

concurrency:
  group: neptlium-product-family-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check
      - run: node scripts/validate-product-hierarchy.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @neptlium/types typecheck
      - run: pnpm --filter @neptlium/types lint
      - run: pnpm --filter @neptlium/treasury typecheck
      - run: pnpm --filter @neptlium/treasury lint
      - run: pnpm --filter @neptlium/treasury test
      - run: pnpm --filter @neptlium/treasury build
      - run: pnpm --filter @neptlium/pay typecheck
      - run: pnpm --filter @neptlium/pay lint
      - run: pnpm --filter @neptlium/pay test
      - run: pnpm --filter @neptlium/pay build
      - run: pnpm --filter @neptlium/docs typecheck
      - run: pnpm --filter @neptlium/docs lint
      - run: pnpm --filter @neptlium/docs test
      - run: pnpm --filter @neptlium/docs build
      - run: pnpm --filter @neptlium/status typecheck
      - run: pnpm --filter @neptlium/status lint
      - run: pnpm --filter @neptlium/status test
      - run: pnpm --filter @neptlium/status build
      - run: pnpm --filter @neptlium/web typecheck
      - run: pnpm --filter @neptlium/web lint
      - run: pnpm --filter @neptlium/web test
      - run: pnpm --filter @neptlium/web build
